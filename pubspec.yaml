name: imc_app
description: "Calculadora de IMC em Flutter que guarda os resultados da sessão em uma lista."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    - family: DejaVuSerif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
